[workspace]
resolver = "3"
members = [
    "composable-architecture",
    "composable-dependencies",
    "composable-views",
    "examples"
]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"


[workspace.dependencies]
composable = { path = "composable-architecture" }
composable-dependencies = { path = "composable-dependencies" }
futures = { version = "0.3", features = ["std"], default-features = false }
mimalloc = { version = "0.1.50" }

# dev-dependencies
static_assertions = "1.1.0"
embed-doc-image = "0.1.4"
divan = "0.1.21"
log = "0.4.28"


[profile.release]
codegen-units = 1
incremental = false
debug = false
strip = true
lto = "fat"

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.dev.package."*"]
opt-level = 3
