[package]
name = "composable-views"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
mimalloc = ["composable/mimalloc"]
default = []


[dependencies]
composable.workspace = true
uuid = { version = "1.18.1", features = ["v4", "serde"] }
git-version = "0.3.9"
lyon = "1.0.16"
log = "0.4.28"
dpi = "0.1.2"
simple_logger = "5.1.0"

[dependencies.ui_id]
path = "src/ui_id"

[dev-dependencies]
toml_edit = { version = "0.23.9", features = ["parse", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
atomic-write-file = "0.3.0"
directories = "6.0.0"
chrono = "0.4.42"

take-once = "0.1.3"
fallible-iterator = "0.3.0"
iter_tools = "0.43.0"
const_format = "0.2.35"
keyboard-types = "0.7"
winit = "0.31.0-beta.2"
meshopt = "0.6.2"
muda = "0.17.1"
wgpu = "27.0.1"


# platforms
[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
features = ["Win32_UI", "Win32_UI_WindowsAndMessaging"]
version = "0.61.2"
[target.'cfg(target_os = "macos")'.dependencies.cocoa]
version = "0.26.0"


[[example]]
name = "Game" # used as the application menu title
path = "examples/game/main.rs"
required-features = []
