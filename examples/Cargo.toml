[package]
name = "examples"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
mimalloc = ["composable/mimalloc"]
default = []

[dependencies]
composable.workspace = true
composable-views = { path = "../composable-views" }
tracing.workspace = true

quickcheck.workspace = true
quickcheck_macros.workspace = true
tracing-tracy = { version = "0.11.4", features = ["enable", "only-localhost", "sampling"] }
tracing-subscriber = "0.3.23"

# foundations
unicode-segmentation = "1.13.3"
itertools = "0.15.0"
#iter-set = "2.0.2"
fastrand = "2.4.1"

# example apps
log = "0.4.1"
raplay = "0.5.0"
take-once = "0.1.3"
simple_logger = "5.1.0"
git-version = "0.3.9"
directories = "6.0"
winit = "0.31.0-beta.2"
meshopt = "0.6.2"
chrono = "0.4.42"
wgpu = "29.0.3"
muda = "0.19.1"
dpi = "0.1.2"


[dev-dependencies]
bit-set = { version = "0.10", default-features = false }

[[bin]]
name = "Alarm" # used as the application menu title
path = "alarm/main.rs"

[lib]
name = "foundations"
path = "foundations/mod.rs"
