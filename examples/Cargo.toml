[package]
name = "examples"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
mimalloc = ["composable/mimalloc"]
default = []

[dependencies]
composable.workspace = true
composable-views = { path = "../composable-views" }
log.workspace = true

raplay = "0.4.3"
simple_logger = "5.1.0"
